        @keyframes pulseRing {

        @keyframes dashStream {

        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .anim-slide {
            animation: slideUpFade 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;

        .anim-pulse-ring { animation: pulseRing 3s ease-in-out infinite; }
        .svg-stream {
            stroke-dasharray: 8 8;
            animation: dashStream 1.2s linear infinite;
        }
        .bg-animated-gradient {

        let currentSlide = 0;

        function renderSlide() {
            const slide = slides[currentSlide];
            const viewport = document.getElementById('slideViewport');
            const counter = document.getElementById('slideCounter');
            const timeText = document.getElementById('timeText');
            const progressBar = document.getElementById('progressBar');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            if (viewport) viewport.innerHTML = slide.render();
            if (counter) counter.textContent = `${String(currentSlide + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`;
            if (timeText) timeText.textContent = slide.time;
            if (progressBar) progressBar.style.width = `${((currentSlide + 1) / slides.length) * 100}%`;
            if (prevBtn) prevBtn.disabled = currentSlide === 0;
            if (nextBtn) nextBtn.disabled = currentSlide === slides.length - 1;
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                renderSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSlide();
            }
        });

        window.nextSlide = nextSlide;
        window.prevSlide = prevSlide;

        window.onload = () => {
            renderSlide();
        };
    </script>
